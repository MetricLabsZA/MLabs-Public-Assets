<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ditholwana Tsa Rena Development Trust - Live Data Governance & Impact Command Dashboard</title>
<style>
:root{--bg:#04150f;--panel:#0a2b22;--panel2:#0d352a;--line:#14493b;--g:#3fbf7f;--a:#e8a71c;--r:#d64545;--t:#e8f3ee;--m:#8fb3a5;--gold:#f2c230}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:radial-gradient(circle at 50% -10%,#0c3a2c,var(--bg) 60%);color:var(--t);min-height:100vh;padding:18px}
.wrap{max-width:1300px;margin:0 auto;background:rgba(6,32,25,.85);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:20px;font-weight:600;letter-spacing:.2px}
.sub{font-size:12px;color:var(--m);margin-top:4px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:38px;height:38px}
.logo b{display:block;font-size:11px;color:var(--gold);letter-spacing:1.3px;line-height:1.2}
.logo span{font-size:9px;color:var(--m);letter-spacing:1.1px}
.tabbar{position:relative;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--g) transparent;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{height:5px}
.tabs::-webkit-scrollbar-thumb{background:var(--g);border-radius:3px}
.tab{background:none;border:none;color:var(--m);padding:13px 16px;font-size:12.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex:none}
.tab:hover{color:var(--t)}
.tab.on{color:var(--g);border-bottom-color:var(--g);background:var(--bg)}
.scrollhint{position:absolute;top:0;right:0;bottom:0;width:26px;background:linear-gradient(to right,transparent,var(--panel) 70%);pointer-events:none}
.slicers{display:flex;gap:16px;align-items:center;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.slicers label{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.6px;margin-right:6px}
.chip{background:var(--bg);color:var(--m);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;margin-right:4px}
.chip.on{background:var(--g);color:#04150f;border-color:var(--g)}
select{background:var(--bg);color:var(--t);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
main{padding:20px 24px 24px}
.g12{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.k,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.k{text-align:center}
.k .l{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.k .v{font-size:24px;font-weight:600}
.k .s{font-size:11px;color:var(--m);margin-top:3px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px}
.G{color:var(--g)}.A{color:var(--a)}.R{color:var(--r)}.M{color:var(--m)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tile{border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;border:2px solid transparent;transition:.15s}
.tile:hover{transform:translateY(-2px)}
.tile.sel{border-color:#fff}
.tile.g{background:#0f5a3f}.tile.a{background:#9a6a0a}.tile.r{background:#7a1f1f}
.tile .n{font-size:12px}.tile .p{font-size:28px;font-weight:600}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px}
.bar .g{background:var(--g)}.bar .a{background:var(--a)}.bar .r{background:var(--r)}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border:none}.row span:first-child{color:var(--m)}.row b{font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge.g{background:#0f5a3f;color:#7be3ae}.badge.a{background:#5a3f0a;color:var(--a)}.badge.r{background:#5a1616;color:#ff8f8f}
.flex{display:flex;align-items:center;gap:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.narr{font-size:13px;line-height:1.6;color:var(--m)}.narr b{color:var(--t)}
svg text{fill:var(--m);font-size:10px}
.foot{text-align:center;font-size:12px;color:var(--m);padding:14px;border-top:1px solid var(--line)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    <div class="logo">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#0d352a" stroke="#f2c230" stroke-width="2"/><path d="M12 20c0-6 5-9 8-8l4 6 4-6c3-1 8 2 8 8 0 5-3 8-5 8l-1 8h-3l-1-9h-4l-1 9h-3l-1-8c-2 0-5-3-5-8z" fill="#3fbf7f"/></svg>
      <div><b>DITHOLWANA TSA RENA</b><span>COMMUNITY DEVELOPMENT TRUST</span></div>
    </div>
  </header>
  <div class="tabbar">
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="exec">Executive Overview</button>
      <button class="tab" data-tab="fin">Financial Oversight</button>
      <button class="tab" data-tab="clu">Village Cluster Monitoring</button>
      <button class="tab" data-tab="opc">Project Operational Control</button>
      <button class="tab" data-tab="pmd">Project Management Dashboard</button>
    </nav>
    <div class="scrollhint"></div>
  </div>
  <div class="slicers">
    <div><label>Village Cluster</label><span id="clSl"></span></div>
    <div><label>Reporting to</label><select id="mSl"></select></div>
    <button class="chip" id="reset">Reset filters</button>
  </div>
  <main id="view"></main>
  <div class="foot">A unified intelligence platform enabling transparent governance, proactive risk management, and measurable community impact.<br>Built by the <a href="https://metriclabs.co.za" target="_blank" rel="noopener" style="color:var(--g);text-decoration:none;font-weight:600">MetricLabs Data Intelligence</a> team</div>
</div>

<script>
/* ---------- Data (amounts in R millions) ---------- */
const CL=[
 {n:'Mokopane',  bud:640,spend:510,ovr:1.5,sav:.8,health:91,esg:[3.1,3.0,2.7],esgT:8.8,jobs:130,skills:78,sent:8.6,proj:12,ok:11,late:1,active:7,done:4,pb:400,ps:300,po:15,wf:36,att:94,tasks:50,risks:4,flags:2,comp:96,yj:68,loc:32,ms:72,ph:[100,96,82,64,45],alloc:99,prod:52,jc:140,days:20},
 {n:'Mapela',    bud:560,spend:420,ovr:1.5,sav:.7,health:76,esg:[2.8,2.7,2.5],esgT:8.0,jobs:115,skills:64,sent:8.0,proj:10,ok:8, late:1,active:6,done:3,pb:350,ps:247,po:12.5,wf:31,att:92,tasks:42,risks:5,flags:2,comp:94,yj:65,loc:27,ms:64,ph:[100,90,70,50,30],alloc:98,prod:46,jc:120,days:19},
 {n:'Ditholwana',bud:430,spend:240,ovr:1.5,sav:.6,health:43,esg:[2.3,2.4,1.9],esgT:6.6,jobs:60, skills:32,sent:6.4,proj:6, ok:4, late:2,active:3,done:1,pb:225,ps:142,po:22,  wf:20,att:88,tasks:28,risks:6,flags:4,comp:90,yj:60,loc:19,ms:52,ph:[95,70,45,25,10],alloc:96,prod:38,jc:80,days:20}
];
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const W =[.06,.08,.10,.10,.12,.13,.13,.14,.14];
const PW=[.08,.10,.11,.11,.11,.11,.12,.13,.13];
const S={cl:'All',m:8,tab:'exec'};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const cw=(w,i)=>sum(w.slice(0,i+1),x=>x);
const sel=()=>S.cl==='All'?CL:CL.filter(c=>c.n===S.cl);
const money=v=>v>=1000?'R'+(v/1000).toFixed(2)+'B':'R'+Math.round(v)+'M';
const m1=v=>'R'+v.toFixed(1)+'M';
const cls=(v,g,a)=>v>=g?'g':v>=a?'a':'r';
const CC={g:'#3fbf7f',a:'#e8a71c',r:'#d64545'};
const bar=(p,c)=>`<div class="bar"><i class="${c||cls(p,80,60)}" style="width:${Math.min(100,Math.max(0,p))}%"></i></div>`;
const kpi=(l,v,s,c)=>`<div class="k"><div class="l">${l}</div><div class="v ${c||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const card=(t,b,c)=>`<div class="card ${c||'c4'}"><h3>${t}</h3>${b}</div>`;

function stats(){
  const d=sel(), i=S.m, f=cw(W,i), pf=cw(PW,i);
  const bud=sum(d,c=>c.bud), sp=sum(d,c=>c.spend*f), plan=sum(d,c=>(c.spend-c.ovr)*pf);
  const proj=sum(d,c=>c.proj);
  return{d,bud,sp,plan,var:sp-plan,util:sp/bud*100,jobs:sum(d,c=>c.jobs),
    ontrack:sum(d,c=>c.ok)/proj*100,esg:sum(d,c=>c.esgT*c.bud)/bud,
    esgc:[0,1,2].map(j=>sum(d,c=>c.esg[j]*c.bud)/bud),
    sav:sum(d,c=>c.sav),skills:sum(d,c=>c.skills),sent:sum(d,c=>c.sent*c.jobs)/sum(d,c=>c.jobs),proj,f};
}
function series(d){
  const lab=MO.slice(0,S.m+1);
  return{lab,act:lab.map((_,i)=>sum(d,c=>c.spend*cw(W,i))),plan:lab.map((_,i)=>sum(d,c=>(c.spend-c.ovr)*cw(PW,i)))};
}

/* ---------- Chart builders ---------- */
function line(lab,ss,h){
  h=h||190;const W_=600,p=34,mx=Math.max(...ss.flatMap(s=>s.d))*1.1||1;
  const x=i=>p+i*(W_-p-10)/Math.max(1,lab.length-1), y=v=>h-24-(v/mx)*(h-40);
  let o=`<svg viewBox="0 0 ${W_} ${h}" width="100%">`;
  for(let g=0;g<=4;g++){const v=mx*g/4,yy=y(v);o+=`<line x1="${p}" x2="${W_-8}" y1="${yy}" y2="${yy}" stroke="#14493b"/><text x="2" y="${yy+3}">${Math.round(v)}</text>`}
  lab.forEach((l,i)=>o+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`);
  ss.forEach(s=>{
    const pts=s.d.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    if(s.area)o+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(s.d.length-1)},${y(0)}" fill="${s.c}" opacity=".12"/>`;
    o+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2.5" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    s.d.forEach((v,i)=>o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.c}"><title>${s.n}: R${Math.round(v)}M (${lab[i]})</title></circle>`);
  });
  return o+'</svg>';
}
function donut(p,c,big,sub,sz){
  const r=54,L=2*Math.PI*r;sz=sz||130;
  return `<div style="position:relative;width:${sz}px;flex:none"><svg viewBox="0 0 120 120" width="${sz}" style="transform:rotate(-90deg)"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#14493b" stroke-width="13"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-Math.min(100,p)/100)}"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:${sz>110?26:20}px;font-weight:600">${big}</div>${sub?`<div style="font-size:10px;color:var(--m)">${sub}</div>`:''}</div></div>`;
}
function tiles(){
  return `<div class="tiles">`+CL.map(c=>`<div class="tile ${cls(c.health,80,60)} ${S.cl===c.n?'sel':''}" data-cl="${c.n}"><div class="n">${c.n}</div><div class="p">${c.health}</div></div>`).join('')+`</div><div class="sub" style="margin-top:8px">Tap a cluster to filter the whole dashboard</div>`;
}
function map(){
  const P=[['Mokopane','M40 60 Q35 25 80 25 Q120 30 115 70 Q100 95 60 90 Z',[75,58]],['Mapela','M125 55 Q140 20 190 30 Q230 45 220 85 Q190 105 145 95 Z',[172,62]],['Ditholwana','M70 100 Q110 92 150 105 Q170 135 120 150 Q70 150 60 125 Z',[112,126]]];
  return `<svg viewBox="0 0 260 165" width="100%">`+P.map(([n,d,[x,y]])=>{const c=CL.find(k=>k.n===n),k=cls(c.health,80,60);
    return `<g data-cl="${n}" style="cursor:pointer"><path d="${d}" fill="${CC[k]}" opacity="${S.cl==='All'||S.cl===n?.75:.2}" stroke="#04150f" stroke-width="2"/><text x="${x}" y="${y}" text-anchor="middle" style="fill:#fff;font-size:10px;font-weight:600">${n}</text></g>`}).join('')+`<text x="250" y="160" text-anchor="end">Limpopo</text></svg><div style="display:flex;gap:8px"><span class="badge g">Pass</span><span class="badge a">Watch</span><span class="badge r">Fail</span></div>`;
}
const esgList=s=>[['Environmental',s.esgc[0],'#3fbf7f'],['Social',s.esgc[1],'#e8a71c'],['Governance',s.esgc[2],'#2a8fa6']].map(([n,v,c])=>`<div class="row"><span><i class="dot" style="background:${c}"></i>${n}</span><b>${v.toFixed(1)}</b></div>`).join('')+`<div class="row"><span>Total</span><b>${s.esg.toFixed(1)}</b></div>`;
const scope=()=>S.cl==='All'?'all village clusters':S.cl;

/* ---------- Tabs ---------- */
const V={
exec(s){
  const sr=series(s.d),k=cls(s.esg*10,75,60);
  return `<div class="kpis">${kpi('Total Budget',money(s.bud))}${kpi('Year-to-Date Spend',money(s.sp),'to '+MO[S.m])}${kpi('Active Jobs',s.jobs)}${kpi('Projects On Track',Math.round(s.ontrack)+'%')}${kpi('ESG Index',s.esg.toFixed(1),'',k==='g'?'G':'A')}</div>
  <div class="g12">
   ${card('Portfolio Financial Performance (R M, cumulative)',line(sr.lab,[{n:'Actual',d:sr.act,c:'#3fbf7f',area:1}],170),'c5')}
   ${card('Village Cluster Health Overview',tiles(),'c4')}
   ${card('ESG Summary',`<div class="flex">${donut(s.esg*10,'#e8a71c',s.esg.toFixed(1),'',110)}<div style="flex:1">${esgList(s)}</div></div>`,'c3')}
  </div>
  <div class="g12">
   ${card('Budget vs Actual Spend',`<div class="flex">${donut(s.util,CC[cls(100-Math.abs(s.util-75)*2,80,60)],Math.round(s.util)+'%','Utilisation')}<div><div style="font-size:28px;font-weight:600">${Math.round(s.util+4)}</div><div class="sub">Budget performance score</div><span class="badge ${s.var>s.plan*.01?'a':'g'}" style="margin-top:8px">${s.var>s.plan*.01?'Risk':'On plan'}</span></div></div>`,'c5')}
   ${card('Geographic Impact Map',map(),'c7')}
  </div>
  ${card('Narrative',`<div class="narr">This dashboard provides a consolidated, real-time view of the trust's performance across <b>${scope()}</b>. We are managing a total budget of <b>${money(s.bud)}</b>, with <b>${money(s.sp)}</b> spent year-to-date. We currently have <b>${s.jobs}</b> active jobs, with <b>${Math.round(s.ontrack)}%</b> of projects on track. Our ESG composite score stands at <b>${s.esg.toFixed(1)}</b>, reflecting strong governance and community impact. This overview sets the stage for deeper dives into financials, clusters, operations and ESG.</div>`,'c12')}`;
},
fin(s){
  const sr=series(s.d),v=s.var;
  return `<div class="kpis">${kpi('Total Budget',money(s.bud))}${kpi('Year-to-Date Spend',money(s.sp))}${kpi('Active Jobs',s.jobs)}${kpi('Projects On Track',Math.round(s.ontrack)+'%')}${kpi('Variance vs Plan',(v>=0?'-':'+')+m1(Math.abs(v)),v>=0?'Overrun':'Under plan',v>=0?'R':'G')}</div>
  <div class="g12">
   ${card('Portfolio Financial Performance — Plan vs Actual (R M)',line(sr.lab,[{n:'Actual',d:sr.act,c:'#3fbf7f',area:1},{n:'Plan',d:sr.plan,c:'#e8a71c',dash:1}],200)+`<div class="sub"><i class="dot" style="background:#3fbf7f"></i>Actual <i class="dot" style="background:#e8a71c;margin-left:12px"></i>Plan</div>`,'c7')}
   ${card('Budget Utilisation (%)',`<div class="flex">${donut(s.util,CC.a,Math.round(s.util)+'%','of budget')}<div><div class="M" style="font-size:12px">Variance Analysis</div><div class="${v>=0?'R':'G'}" style="font-size:24px;font-weight:600">${v>=0?'-':'+'}${m1(Math.abs(v))}</div><div class="sub">${v>=0?'Cost overrun':'Under plan'}</div></div></div>`,'c5')}
  </div>
  <div class="g12">
   ${card('Variance Analysis by Cluster',s.d.map(c=>{const u=c.spend*s.f/c.bud*100;return `<div style="margin-bottom:12px"><div class="row" style="border:none;padding:0"><span>${c.n}</span><b>${u.toFixed(0)}% utilised</b></div>${bar(u,cls(u,70,50))}</div>`}).join(''),'c4')}
   ${card('Cash Flow Status',`<div class="G" style="font-size:24px;font-weight:600">Positive</div><div class="sub">${m1(Math.abs(v))} ${v>=0?'overrun':'variance'} monitored</div><div style="margin-top:12px"><div class="row"><span>Cost savings</span><b class="G">${m1(s.sav)}</b></div><div class="row"><span>Jobs created</span><b>${s.jobs}</b></div><div class="row"><span>Skills transferred</span><b>${s.skills}</b></div></div>`,'c4')}
   ${card('Traffic-Light Indicators',s.d.map(c=>{const u=c.spend*s.f/c.bud*100,k=cls(u,70,50);return `<div class="row"><span>${c.n}</span><span class="badge ${k}">${k==='g'?'On track':k==='a'?'Attention':'Risk'}</span></div>`}).join(''),'c4')}
  </div>
  ${card('Narrative',`<div class="narr">Here we compare budget vs actual spend across the year for <b>${scope()}</b>. The variance analysis highlights differences between clusters. Budget utilisation is at <b>${Math.round(s.util)}%</b>, with a <b>${v>=0?'-':'+'}${m1(Math.abs(v))}</b> variance against plan. Cash flow remains positive, but overruns must be monitored closely. Traffic-light indicators show where we are on track, where attention is required, and where risks are emerging.</div>`,'c12')}`;
},
clu(s){
  return `<div class="kpis">${kpi('Total Budget',money(s.bud))}${kpi('Year-to-Date Spend',money(s.sp))}${kpi('Active Jobs',s.jobs)}${kpi('Projects On Track',Math.round(s.ontrack)+'%')}${kpi('Budget Utilisation',Math.round(s.util)+'%')}</div>
  <div class="g12">
   ${card('Cluster Health & Variance',tiles(),'c4')}
   ${card('Budget vs Actual Spend (R M)',s.d.map(c=>{const a=c.spend*s.f,b=c.bud;return `<div style="margin-bottom:10px"><div class="row" style="border:none;padding:0"><span>${c.n}</span><b>${money(a)} / ${money(b)}</b></div>${bar(a/b*100,cls(a/b*100,70,50))}</div>`}).join(''),'c4')}
   ${card('Community Sentiment Index',`<div class="flex">${donut(s.sent*10,CC.g,s.sent.toFixed(1),'out of 10',110)}<div style="flex:1">${s.d.map(c=>`<div class="row"><span>${c.n}</span><b class="${cls(c.sent*10,75,60).toUpperCase()}">${c.sent.toFixed(1)}</b></div>`).join('')}</div></div>`,'c4')}
  </div>
  <div class="g12">
   ${card('Active Projects Timeline',s.d.map(c=>{const r=c.proj-c.ok-c.late,t=c.proj;return `<div style="margin-bottom:12px"><div class="row" style="border:none;padding:0"><span>${c.n}</span><b>${c.proj} projects</b></div><div style="display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg)"><div style="width:${c.ok/t*100}%;background:var(--g)" title="On track: ${c.ok}"></div><div style="width:${r/t*100}%;background:var(--a)" title="At risk: ${r}"></div><div style="width:${c.late/t*100}%;background:var(--r)" title="Delayed: ${c.late}"></div></div></div>`}).join('')+`<div class="sub"><i class="dot" style="background:var(--g)"></i>On track <i class="dot" style="background:var(--a);margin-left:10px"></i>At risk <i class="dot" style="background:var(--r);margin-left:10px"></i>Delayed</div>`,'c4')}
   ${card('Employment & Skills Transfer',s.d.map(c=>`<div style="margin-bottom:10px"><div class="row" style="border:none;padding:0"><span>${c.n}</span><b>${c.jobs} jobs · ${c.skills} skilled</b></div>${bar(c.jobs/130*100,'g')}${bar(c.skills/78*100,'a')}</div>`).join(''),'c4')}
   ${card('Workforce Tracker',(()=>{const n=sum(s.d,c=>c.wf),w=(f)=>sum(s.d,c=>f(c)*c.wf)/n;return `<div class="row"><span>Attendance</span><b>${w(c=>c.att).toFixed(0)}%</b></div><div class="row"><span>Productivity</span><b>${w(c=>c.prod).toFixed(0)}</b></div><div class="row"><span>Resource allocation</span><b>${w(c=>c.alloc).toFixed(0)}%</b></div><div class="row"><span>Staff assigned</span><b>${n}</b></div>`})(),'c4')}
  </div>
  ${card('Narrative',`<div class="narr">This focuses on <b>${scope()}</b>. ${CL.map(c=>`${c.n} is performing at <b>${c.health}%</b> budget utilisation`).join(', ')}. Jobs created and skills transfer indicators show tangible community benefits. The project timeline highlights active initiatives and their progress. Employment and skills transfer metrics demonstrate how resources are being invested in local capacity building, and community sentiment is tracked to ensure alignment with local needs.</div>`,'c12')}`;
},
opc(s){
  const d=s.d,f=s.f,ut=sum(d,c=>c.spend*f)/sum(d,c=>c.bud)*100,
   wf=sum(d,c=>c.wf),w=g=>sum(d,c=>g(c)*c.wf)/wf,
   risks=sum(d,c=>c.risks),comp=w(c=>c.comp),openIssues=sum(d,c=>c.late);
  const ms=sum(d,c=>c.ms*c.proj)/sum(d,c=>c.proj);
  return `<div class="kpis">${kpi('Total Budget',money(s.bud))}${kpi('Year-to-Date Spend',money(s.sp))}${kpi('Active Jobs',s.jobs)}${kpi('Projects On Track',Math.round(s.ontrack)+'%')}${kpi('ESG Score',s.esg.toFixed(1))}</div>
  <div class="g12">
   ${card('Milestones & Timelines',s.d.map(c=>`<div style="margin-bottom:12px"><div class="row" style="border:none;padding:0"><span>${c.n}</span><b>${c.ms}% milestones</b></div>${bar(c.ms,cls(c.ms,70,55))}</div>`).join(''),'c5')}
   ${card('Budget vs Actual Spend',`<div class="flex">${donut(ut,CC.a,Math.round(ut)+'%','Utilisation')}<div><span class="badge ${cls(100-Math.abs(ut-70),90,75)}">${ut>75?'Caution zone':'On plan'}</span><div class="sub" style="margin-top:8px">Flagged where utilisation drifts from the 70% planning benchmark</div></div></div>`,'c4')}
   ${card('Risk & Procurement Compliance',`<div style="font-size:26px;font-weight:600" class="${cls(comp,90,80)==='g'?'G':'A'}">${comp.toFixed(0)}%</div><div class="sub">Procurement compliance</div><div class="row" style="margin-top:8px"><span>Open issues</span><b class="A">${openIssues}</b></div><div class="row"><span>Risks identified</span><b>${risks}</b></div>`,'c3')}
  </div>
  <div class="g12">
   ${card('Workforce Tracker',`<div class="row"><span>Attendance</span><b>${w(c=>c.att).toFixed(0)}%</b></div><div class="row"><span>Tasks completed</span><b>${sum(d,c=>c.tasks)}</b></div><div class="row"><span>Days allocated</span><b>${Math.round(w(c=>c.days))}</b></div><div class="row"><span>Staff assigned</span><b>${wf}</b></div>`,'c4')}
   ${card('Compliance Status',s.d.map(c=>`<div class="row"><span>${c.n}</span><span class="badge ${cls(c.comp,95,90)}">${c.comp}% compliant</span></div>`).join(''),'c4')}
   ${card('Operational Status',`<div class="${cls(ms,70,55)==='g'?'G':'A'}" style="font-size:22px;font-weight:600">${ms>=70?'On Track':ms>=55?'Attention':'At Risk'}</div><div class="sub">${ms.toFixed(0)}% average milestone completion</div><div style="margin-top:10px"><span class="badge ${cls(comp,90,80)}">${comp>=90?'Pass':'Watch'}</span> <span class="badge a" style="margin-left:6px">${openIssues} open issues</span></div>`,'c4')}
  </div>
  ${card('Narrative',`<div class="narr">This tracks milestones and timelines for key projects across <b>${scope()}</b>. Budget vs actual spend is currently at <b>${Math.round(ut)}%</b> utilisation, flagged in the caution zone. The workforce tracker shows <b>${w(c=>c.att).toFixed(0)}%</b> attendance, <b>${sum(d,c=>c.tasks)}</b> tasks completed, and about <b>${Math.round(w(c=>c.days))}</b> days allocated. Risk and procurement compliance is strong at <b>${comp.toFixed(0)}%</b>, but <b>${openIssues}</b> open issues remain. This operational view ensures accountability and highlights areas needing corrective action.</div>`,'c12')}`;
},
pmd(s){
  const d=s.d,f=s.f,P=sum(d,c=>c.proj),ph=[0,1,2,3,4].map(j=>sum(d,c=>c.ph[j]*c.proj)/P),
   pb=sum(d,c=>c.pb),ps=sum(d,c=>c.ps)*f,po=sum(d,c=>c.po)*f,ms=sum(d,c=>c.ms*c.proj)/P,
   wf=sum(d,c=>c.wf),w=g=>sum(d,c=>g(c)*c.wf)/wf,ut=ps/pb*100,names=['Start','Planning','Execution','Monitoring','Completion'];
  const status=ms>=70?'g':ms>=55?'a':'r';
  return `<div class="kpis">${kpi('Total Projects',P)}${kpi('Active',sum(d,c=>c.active))}${kpi('Completed',sum(d,c=>c.done))}${kpi('Total Budget',money(pb))}${kpi('Spent',money(ps))}</div>
  <div class="g12">
   ${card('Project Lifecycle (Gantt)',names.map((n,j)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span style="width:80px;font-size:12px;color:var(--m)">${n}</span><div style="flex:1">${bar(ph[j],j%2?'a':'g')}</div><b style="font-size:12px;width:36px">${ph[j].toFixed(0)}%</b></div>`).join('')+`<div class="row" style="margin-top:8px"><span>${ms.toFixed(0)}% milestones achieved</span><b class="A">Cost overrun ${m1(po)}</b></div>`,'c8')}
   ${card('Financial Summary',`<div class="row"><span>Budget</span><b>${money(pb)}</b></div><div class="row"><span>Spent</span><b>${money(ps)}</b></div><div class="row"><span>Utilisation</span><b class="A">${ut.toFixed(1)}%</b></div><div class="row"><span>Overrun</span><b class="R">${m1(po)}</b></div>${bar(ut,'a')}`,'c4')}
  </div>
  <div class="g12">
   ${card('Workforce',`<div style="font-size:24px;font-weight:600">${wf}</div><div class="sub">Staff assigned</div><div class="row" style="margin-top:8px"><span>Attendance</span><b>${w(c=>c.att).toFixed(0)}%</b></div><div class="row"><span>Tasks completed</span><b>${sum(d,c=>c.tasks)}</b></div>`,'c3')}
   ${card('Risk & Compliance',`<div class="row"><span>Risks identified</span><b>${sum(d,c=>c.risks)}</b></div><div class="row"><span>Audit flags</span><b class="A">${sum(d,c=>c.flags)}</b></div><div class="row"><span>Procurement compliance</span><b class="G">${w(c=>c.comp).toFixed(0)}%</b></div>`,'c3')}
   ${card('Completion & Impact',`<div class="row"><span>Jobs created</span><b>${sum(d,c=>c.jc)}</b></div><div class="row"><span>Youth participation</span><b>${w(c=>c.yj).toFixed(0)}%</b></div><div class="row"><span>Local supplier spend</span><b>${money(sum(d,c=>c.loc))}</b></div>`,'c3')}
   ${card('Operational Status',`<div class="${status==='g'?'G':status==='a'?'A':'R'}" style="font-size:22px;font-weight:600">${status==='g'?'On Track':status==='a'?'Attention':'At Risk'}</div><div class="sub">${ms.toFixed(0)}% milestones · Project completion rate</div><div style="margin-top:10px"><span class="badge ${status}">${status==='r'?'Fail':'Pass'}</span></div>`,'c3')}
  </div>
  ${card('Narrative',`<div class="narr">This dashboard tracks our projects from start to completion, offering a full lifecycle view for <b>${scope()}</b>. We currently manage <b>${P}</b> projects, with <b>${sum(d,c=>c.active)}</b> active and <b>${sum(d,c=>c.done)}</b> completed. The total budget is <b>${money(pb)}</b>, and we've spent <b>${money(ps)}</b> so far. The Gantt chart shows each project's progress through five phases. We've achieved <b>${ms.toFixed(0)}%</b> of planned milestones. Financially, we're facing a cost overrun of <b>${m1(po)}</b>, which is flagged for review. On the workforce side, we've assigned <b>${wf}</b> staff, with <b>${w(c=>c.att).toFixed(0)}%</b> attendance and <b>${sum(d,c=>c.tasks)}</b> tasks completed. In terms of impact, we've created <b>${sum(d,c=>c.jc)}</b> jobs, achieved <b>${w(c=>c.yj).toFixed(0)}%</b> youth participation, and spent <b>${money(sum(d,c=>c.loc))}</b> with local suppliers.</div>`,'c12')}`;
}};
const TT={exec:['Live Data Governance & Impact Command Dashboard','Provides a real-time, consolidated view of financial performance, operational delivery, and ESG impact'],
 fin:['Real-Time Financial Oversight','Budget vs actual, variance analysis and cash-flow status'],
 clu:['Village Cluster Monitoring','Mokopane, Mapela and Ditholwana cluster performance'],
 opc:['Project Operational Control','Milestones, timelines, workforce and compliance'],
 pmd:['Project Management Dashboard','Full project lifecycle from start to completion']};

/* ---------- Render & events ---------- */
function render(){
  $('#title').textContent=TT[S.tab][0];$('#subtitle').textContent=TT[S.tab][1];
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===S.tab));
  $('#clSl').innerHTML=['All',...CL.map(c=>c.n)].map(n=>`<button class="chip ${S.cl===n?'on':''}" data-cl="${n}">${n}</button>`).join('');
  $('#mSl').value=S.m;
  $('#view').innerHTML=V[S.tab](stats());
}
$('#mSl').innerHTML=MO.map((m,i)=>`<option value="${i}">${m} (YTD)</option>`).join('');
$('#mSl').onchange=e=>{S.m=+e.target.value;render()};
$('#reset').onclick=()=>{S.cl='All';S.m=8;render()};
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t){S.tab=t.dataset.tab;render();return}
  const c=e.target.closest('[data-cl]');if(c){const n=c.dataset.cl;S.cl=(S.cl===n&&n!=='All')?'All':n;render()}
});
render();
</script>
</body>
</html>
